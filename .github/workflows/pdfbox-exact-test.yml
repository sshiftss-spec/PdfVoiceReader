name: Build isolated PDFBox test APK

on:
  push:
    branches:
      - pdfbox-exact-test
      - pdfbox-exact-test-5e-mark-centering
      - pdfbox-gap-diagnostics-6
    paths:
      - 'pdfbox_exact_test/**'
      - '.github/workflows/pdfbox-exact-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build diagnostic APK
        run: gradle --no-daemon -p pdfbox_exact_test :app:assembleDebug

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: pdfbox-exact-test-apk
          path: pdfbox_exact_test/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
